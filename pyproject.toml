[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-animation"
version = "0.1.0"
description = "Offline MediaPipe to Mixamo animation clip pipeline"
requires-python = ">=3.10,<3.14"

[project.scripts]
mimo = "mimo.main:main"

[tool.setuptools.packages.find]
include = ["backend*", "mimo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
