[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimo-animation"
version = "0.1.0"
description = "Offline MediaPipe to Mixamo animation clip pipeline"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
server = ["Flask>=3.0"]
glb = ["pygltflib>=1.16"]
dev = ["pytest>=8.0", "Flask>=3.0", "pygltflib>=1.16"]

[project.scripts]
mimo = "mimo.main:main"

[tool.setuptools.packages.find]
include = ["backend*", "mimo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
